<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="470" viewBox="0 0 1280 470" role="img" aria-labelledby="t d"><title id="t">Sync from your Mac to your iPhone</title><desc id="d">Your Mac downloads the songs. The iPhone shows Connected by itself and copies each song over your home network. Each cover waits in grey while the song is prepared, then comes up to full colour.</desc><defs><linearGradient id="plate" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#34373C"/><stop offset="1" stop-color="#151619"/></linearGradient>
<linearGradient id="screen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1B1C1F"/><stop offset="1" stop-color="#0E0F11"/></linearGradient>
<linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF8A3D"/><stop offset="1" stop-color="#FF6B1F"/></linearGradient>
<radialGradient id="cap" cx=".36" cy=".3" r=".8"><stop offset="0" stop-color="#52565C"/><stop offset="1" stop-color="#26282C"/></radialGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter></defs><style>.fly{animation:fly 10s ease-in-out infinite backwards}.f2{animation-delay:1.2s}.f3{animation-delay:2.4s}
@keyframes fly{0%,4%{transform:translate(0,0);opacity:0}8%{opacity:1}30%{transform:translate(520px,-34px);opacity:1}34%,100%{transform:translate(530px,-30px);opacity:0}}
.dot{animation:dot 1.6s ease-in-out infinite}@keyframes dot{50%{opacity:.35}}
.cover{animation:cover 10s ease-out infinite backwards}.k2{animation-delay:1.2s}.k3{animation-delay:2.4s}
@keyframes cover{0%,30%{filter:grayscale(1);opacity:.45}52%,94%{filter:grayscale(0);opacity:1}100%{filter:grayscale(1);opacity:.45}}
.ring{transform-box:fill-box;transform-origin:center;animation:ring 1.4s linear infinite}@keyframes ring{to{transform:rotate(360deg)}}
.rg{animation:rg 10s linear infinite backwards}.r2{animation-delay:1.2s}.r3{animation-delay:2.4s}@keyframes rg{0%,30%{opacity:1}36%,100%{opacity:0}}</style><rect width="1280" height="470" rx="28" fill="url(#plate)"/><rect x="90" y="96" width="470" height="290" rx="16" fill="#0E0F11" stroke="#4A4D52" stroke-width="3"/><rect x="60" y="386" width="530" height="20" rx="10" fill="#3B3E43"/><text x="325" y="142" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="800" fill="#8C9096" text-anchor="middle" letter-spacing="2">YOUR MAC DOWNLOADS</text><rect x="130" y="166" width="50" height="50" rx="9" fill="#FF8A3D"/><rect x="196" y="176" width="190" height="11" rx="5" fill="#C9CCD1"/><rect x="196" y="196" width="120" height="9" rx="4" fill="#5A5E64"/><g class="fly f1"><rect x="478" y="166" width="50" height="50" rx="9" fill="#FF8A3D"/></g><rect x="130" y="232" width="50" height="50" rx="9" fill="#5AA9FF"/><rect x="196" y="242" width="160" height="11" rx="5" fill="#C9CCD1"/><rect x="196" y="262" width="104" height="9" rx="4" fill="#5A5E64"/><g class="fly f2"><rect x="478" y="232" width="50" height="50" rx="9" fill="#5AA9FF"/></g><rect x="130" y="298" width="50" height="50" rx="9" fill="#B57BFF"/><rect x="196" y="308" width="130" height="11" rx="5" fill="#C9CCD1"/><rect x="196" y="328" width="88" height="9" rx="4" fill="#5A5E64"/><g class="fly f3"><rect x="478" y="298" width="50" height="50" rx="9" fill="#B57BFF"/></g><path d="M 600 240 C 680 200 760 200 840 240" stroke="#FF8A3D" stroke-width="3" stroke-dasharray="3 12" stroke-linecap="round" fill="none" opacity=".7"/><g class="dot"><circle cx="720" cy="120" r="6" fill="#FF8A3D"/></g><text x="736" y="126" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="700" fill="#E9EAEC" text-anchor="start" >Connected</text><text x="720" y="152" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="500" fill="#9CA0A6" text-anchor="middle" >over your home network</text><rect x="880" y="40" width="240" height="390" rx="38" fill="#0E0F11" stroke="#4A4D52" stroke-width="4"/><rect x="960" y="54" width="80" height="20" rx="10" fill="#26282C"/><text x="1000" y="108" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="800" fill="#8C9096" text-anchor="middle" letter-spacing="2">YOUR IPHONE</text><g class="cover k1"><rect x="902" y="130" width="62" height="62" rx="11" fill="#FF8A3D"/><circle cx="933" cy="161" r="14" fill="#7A2E10"/></g><g class="rg r1"><circle class="ring" cx="933" cy="161" r="20" fill="none" stroke="#FF8A3D" stroke-width="3" stroke-dasharray="30 96" stroke-linecap="round"/></g><rect x="978" y="144" width="112" height="11" rx="5" fill="#C9CCD1"/><rect x="978" y="166" width="76" height="9" rx="4" fill="#5A5E64"/><g class="cover k2"><rect x="902" y="214" width="62" height="62" rx="11" fill="#5AA9FF"/><circle cx="933" cy="245" r="14" fill="#123A66"/></g><g class="rg r2"><circle class="ring" cx="933" cy="245" r="20" fill="none" stroke="#FF8A3D" stroke-width="3" stroke-dasharray="30 96" stroke-linecap="round"/></g><rect x="978" y="228" width="98" height="11" rx="5" fill="#C9CCD1"/><rect x="978" y="250" width="66" height="9" rx="4" fill="#5A5E64"/><g class="cover k3"><rect x="902" y="298" width="62" height="62" rx="11" fill="#B57BFF"/><circle cx="933" cy="329" r="14" fill="#3A1E66"/></g><g class="rg r3"><circle class="ring" cx="933" cy="329" r="20" fill="none" stroke="#FF8A3D" stroke-width="3" stroke-dasharray="30 96" stroke-linecap="round"/></g><rect x="978" y="312" width="84" height="11" rx="5" fill="#C9CCD1"/><rect x="978" y="334" width="56" height="9" rx="4" fill="#5A5E64"/></svg>