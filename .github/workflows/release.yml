name: Release

# Every push to main builds Knob and publishes a GitHub release. Installed copies of Knob read
# releases/latest/download/appcast.xml and update themselves. Docs-only pushes don't release.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".claude/**"
      - "LICENSE"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the release (only from main). Off builds everything and publishes nothing."
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Build and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KNOB_SIGNING_P12_BASE64: ${{ secrets.KNOB_SIGNING_P12_BASE64 }}
          KNOB_SIGNING_P12_PASSWORD: ${{ secrets.KNOB_SIGNING_P12_PASSWORD }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        # Publishes only from main. A manual run with publish off, or from any other branch, is a
        # trial: it builds and signs everything, to time or check it, and publishes nothing.
        run: bash scripts/release/release.sh ${{ (github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.publish)) && '--publish' || '' }}
